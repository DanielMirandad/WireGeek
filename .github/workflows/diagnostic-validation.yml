name: Diagnostic validation

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    if: github.head_ref == 'diagnostic/editorial-error-codes' || github.ref == 'refs/heads/diagnostic/editorial-error-codes'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm

      # Validation only: no secrets, deployment, database access, or editorial execution.
      - name: Install dependencies
        run: npm ci

      - name: Syntax check
        run: |
          node --check lib/openai-responses.mjs
          node --check lib/editorial-execution.mjs

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
