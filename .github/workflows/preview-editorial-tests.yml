name: Preview editorial tests
on:
  push:
    branches:
      - feat/site-editorial-human-auto-repair
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      # Prevent network-driven editorial inference and credentials in test/build jobs.
      OPENAI_API_KEY: ""
      SUPABASE_SERVICE_ROLE_KEY: ""
      SUPABASE_SECRET_KEY: ""
      SITE_EDITORIAL_MAX_REPAIR_ROUNDS: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Syntax checks
        run: |
          node --check lib/editorial-pilot-budget.mjs
          node --check lib/site-editorial.mjs
          node --check tests/editorial-pilot-budget.test.mjs
      - name: All tests (mocked inference)
        run: npm test
      - name: Build
        run: npm run build
